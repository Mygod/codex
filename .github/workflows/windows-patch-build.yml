name: windows-patch-build

on:
  workflow_dispatch: {}
  push:
    branches:
      - fix-windows

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo build
        shell: bash
        run: |
          cargo build --target x86_64-pc-windows-msvc --release \
            --bin codex \
            --bin codex-responses-api-proxy \
            --bin codex-windows-sandbox-setup \
            --bin codex-command-runner

      - name: Stage artifacts
        shell: bash
        run: |
          dest="dist/x86_64-pc-windows-msvc"
          mkdir -p "$dest"
          cp target/x86_64-pc-windows-msvc/release/codex.exe "$dest/codex-x86_64-pc-windows-msvc.exe"
          cp target/x86_64-pc-windows-msvc/release/codex-responses-api-proxy.exe "$dest/codex-responses-api-proxy-x86_64-pc-windows-msvc.exe"
          cp target/x86_64-pc-windows-msvc/release/codex-windows-sandbox-setup.exe "$dest/codex-windows-sandbox-setup-x86_64-pc-windows-msvc.exe"
          cp target/x86_64-pc-windows-msvc/release/codex-command-runner.exe "$dest/codex-command-runner-x86_64-pc-windows-msvc.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: windows-patch-build-x86_64-pc-windows-msvc
          path: codex-rs/dist/x86_64-pc-windows-msvc/*
